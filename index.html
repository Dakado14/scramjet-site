<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scramjet</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #111; color: #fff; }
    form { display: flex; gap: 8px; width: 90%; max-width: 500px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #3b82f6; color: #fff; font-weight: bold; cursor: pointer; }
  </style>
  <script src="https://unpkg.com"></script>
  <script src="/scram/scramjet.all.js"></script>
</head>
<body>
  <h1>Scramjet</h1>
  <form id="proxy-form">
    <input id="url-input" type="text" placeholder="Enter URL (e.g. https://example.com)" required />
    <button type="submit">Go</button>
  </form>

  <script>
    const WISP_URL = "wss://://onrender.com";

    const { ScramjetController } = $scramjetLoadController();
    const scramjet = new ScramjetController({
      files: {
        wasm: "/scram/scramjet.wasm.wasm",
        all: "/scram/scramjet.all.js",
        sync: "/scram/scramjet.sync.js",
      },
    });

    async function init() {
      await scramjet.init();
      await navigator.serviceWorker.register("/sw.js", { scope: "/" });
      await navigator.serviceWorker.ready;
      const connection = new BareMux.BareMuxConnection("/baremux/worker.js");
      await connection.setTransport("https://unpkg.com", [{ wisp: WISP_URL }]);
    }

    const readyPromise = init();

    document.getElementById("proxy-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await readyPromise;
      let url = document.getElementById("url-input").value.trim();
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }
      window.location.href = scramjet.encodeUrl(url);
    });
  </script>
</body>
</html>
